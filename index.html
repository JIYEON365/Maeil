<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 나</title><meta name="theme-color" content="#fff0b3"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="오늘의 나"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6efe4;--b1:#f3d3bd;--b2:#d5e2cc;--card:rgba(255,252,246,.82);--ink:#3b302a;--sub:#8f7f72;--acc:#c9704a;--sage:#7f9f78;--line:#e6d9c6;--soft:#efe4d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1715;--b1:#4a2e22;--b2:#2a3a2c;--card:rgba(44,37,33,.85);--ink:#f2e8dc;--sub:#a99a8c;--acc:#e8956f;--sage:#9dbb96;--line:#3d3530;--soft:#382f2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1715;--b1:#4a2e22;--b2:#2a3a2c;--card:rgba(44,37,33,.85);--ink:#f2e8dc;--sub:#a99a8c;--acc:#e8956f;--sage:#9dbb96;--line:#3d3530;--soft:#382f2a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55;padding-bottom:100px;background:radial-gradient(70% 45% at 0 0,var(--b1),transparent),radial-gradient(60% 45% at 100% 30%,var(--b2),transparent),var(--bg);background-attachment:fixed;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:14px 16px}
h2{font:700 17px "Gowun Batang",serif;margin:0 0 12px;letter-spacing:-.2px}
h2 small{font:400 12px "Gowun Dodum",sans-serif;color:var(--sub);margin-left:6px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(120,80,50,.07)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.nv{font-size:30px;color:var(--sub);padding:6px 14px}
.dt{text-align:center}.mo{font-size:13px;color:var(--sub);letter-spacing:1px}
.dd{font:700 64px/1 "Gowun Batang",serif;color:var(--acc)}.wk{font-size:14px;color:var(--sub);margin-top:2px}
.tools{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.pk{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
input[type=date]{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 8px}
.q{font:italic 400 14px "Gowun Batang",serif;color:var(--sub);text-align:center;margin:8px 0 0}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:15px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;align-items:center;gap:10px}
.pri{background:var(--acc);color:#fff;border-radius:14px;padding:10px 18px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;display:inline-block;cursor:pointer}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.x{color:var(--sub);font-size:13px;padding:4px 8px}
.f{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.f:last-of-type{border:0}.f span{flex:1}.f.done span{color:var(--sub);text-decoration:line-through}
.ck{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--acc);font:700 14px "Gowun Batang",serif;color:var(--acc);flex:none}
.ck.on{background:var(--sage);border-color:var(--sage);color:#fff}
.msg{background:var(--soft);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-top:10px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ens{display:flex;justify-content:space-between}
.ec{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);padding:4px}
.ec i{width:36px;height:36px;border-radius:50%;background:var(--c);opacity:.55;display:block}
.ec.on i{opacity:1;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}.ec.on{color:var(--ink)}
.ent{border-top:1px dashed var(--line);padding:12px 0;margin-top:12px}
.ent .sub{font-size:12px;color:var(--sub)}
img.pv,.ent img{max-width:100%;border-radius:14px;margin-top:8px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wh{text-align:center;font-size:11px;color:var(--sub)}
.cl{aspect-ratio:1/1.12;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 2px;font-size:13px;position:relative}
.cl.td{outline:2px solid var(--acc)}.cl.em{background:none}
.cl .ds{display:flex;gap:2px;font-size:9px;height:10px;line-height:10px}
.cl .ds b{width:5px;height:5px;border-radius:50%;background:var(--sage);display:block;margin-top:2px}
.lg{display:flex;gap:10px;justify-content:center;font-size:11px;color:var(--sub);margin-top:10px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin:4px 0 10px}.bar div{height:100%;background:var(--sage)}
.gh{font:700 15px "Gowun Batang",serif;color:var(--acc);margin:18px 4px 0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:99px;display:flex;padding:5px;box-shadow:0 8px 28px rgba(80,50,30,.18)}
nav button{padding:10px 15px;border-radius:99px;font-size:14px;color:var(--sub)}
nav button.on{background:var(--acc);color:#fff}
.chip.half{background:var(--soft);border-color:var(--sage);color:var(--sage)}.hint{font-size:12.5px;color:var(--sub);margin-top:8px}.sub{font-size:12px;color:var(--sub)}.sm{font-size:13.5px;color:var(--sub)}
.mr{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}.mr span{flex:1}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.mm{border-top:1px dashed var(--line);padding:10px 0}.mm:first-of-type{border:0}label.rq{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
body,button,input,textarea,h2,.dd,.ck,.gh,.q{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.q{font-style:normal}.dd{font-weight:500;letter-spacing:-2px}h2{letter-spacing:-.3px}
button,.chip{white-space:nowrap}.pri{flex:none;padding:10px 16px}.row input[type=text]{flex:1;min-width:0}.tools{flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);flex:none}
input[type=color]{width:34px;height:28px;border:0;background:none;padding:0}
img{max-width:100%;height:auto}.card{overflow:hidden;min-width:0}
#lst .card img{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-top:8px;display:block}
input[type=time],input[type=number]{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 8px}
.tb{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<nav><button id="t0" onclick="tab(0)">하루</button><button id="t1" onclick="tab(1)">달력</button><button id="t2" onclick="tab(2)">기록들</button><button id="t3" onclick="tab(3)">회고</button></nav>
<script>
var K='maeil-v1',S={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S.focus=S.focus||{};S.routines=S.routines||['스페인어','운동','스터디'];S.chk=S.chk||{};S.energy=S.energy||{};S.rest=S.rest||{};S.diary=S.diary||[];S.inbox=S.inbox||[];S.rec=S.rec||[];S.recDone=S.recDone||{};S.min=S.min||{};S.win=S.win||{};S.rev=S.rev||{};
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){alert('저장 공간이 부족해요. 오래된 사진을 지워 주세요.');return false}}
var ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
var pd=s=>new Date(s+'T00:00:00');
var T=ds(new Date()),sel=T,mg=false,q='',po=false,cur=0,photo=null,draft='',editId=null,cm=T.slice(0,7);
var WD=['일','월','화','수','목','금','토'],EC=['#8fa3bd','#b5a7cf','#e6c58f','#eaa27f','#9fc596'],EL=['바닥','낮음','보통','좋음','충만'];
var Q=['오늘은 이 정도면 충분해요','쉬는 것도 오늘의 할 일이에요','시작한 것만으로 이미 잘하고 있어요','하나씩, 천천히. 나머지는 내일의 내가','아무것도 안 해도 괜찮은 시간'];
var esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tab(n){cur=n;for(var i=0;i<4;i++)document.getElementById('t'+i).className=i==n?'on':'';render();scrollTo(0,0)}
function render(){document.getElementById('app').innerHTML=[vDay,vCal,vList,vRev][cur]()}
function go(n){var d=pd(sel);d.setDate(d.getDate()+n);sel=ds(d);render()}
function jump(k){sel=k;tab(0)}
function vDay(){
var d=pd(sel),F=S.focus[sel]||[],C=S.chk[sel]||{},E=S.energy[sel]||0,h='';
h+='<div class="hd"><button class="nv" onclick="go(-1)">‹</button><div class="dt"><div class="mo">'+d.getFullYear()+'년 '+(d.getMonth()+1)+'월</div><div class="dd">'+d.getDate()+'</div><div class="wk">'+WD[d.getDay()]+'요일'+(sel==T?' · 오늘':'')+'</div></div><button class="nv" onclick="go(1)">›</button></div>';
h+='<div class="tools"><label class="pk">날짜 이동<input type="date" value="'+sel+'" onchange="if(this.value){sel=this.value;render()}"></label>'+(sel!=T?'<button class="chip" onclick="sel=T;render()">오늘로</button>':'')+'<button class="chip" onclick="bgp=!bgp;render()">배경색</button></div>'+thH()+'<p class="q">“'+Q[d.getDate()%Q.length]+'”</p>';
h+='<section class="card"><h2>오늘의 초점<small>딱 3가지만</small></h2>';
F.map((f,i)=>i).sort((a,b)=>(F[a].time||'99').localeCompare(F[b].time||'99')||a-b).forEach((i,k)=>{var f=F[i];h+='<div class="f'+(f.d?' done':'')+'"><button class="ck'+(f.d?' on':'')+'" onclick="tog('+i+')">'+(f.d?'✓':k+1)+'</button><span onclick="edF('+i+')">'+(f.time?'<b class="tb">'+f.time+'</b> ':'')+esc(f.t)+'</span><button class="x" onclick="tmF('+i+')">시간</button><button class="x" onclick="delF('+i+')">삭제</button></div>'});
if(F.length<3)h+='<div class="row" style="margin-top:8px"><input type="text" id="fi" placeholder="가장 중요한 한 가지" onkeydown="if(event.key==\'Enter\')addF()"><button class="pri" onclick="addF()">추가</button></div><label class="pk" style="margin-top:8px">시간이 중요하면 <input type="time" id="ft"></label>';
else h+='<div class="msg">3가지면 충분해요. 나머지는 내일의 나에게 맡겨요.</div>';
if(F.length&&F.every(f=>f.d))h+='<div class="msg">모두 마쳤어요. 정말 수고했어요.</div>';
h+='</section>'+recH()+'<section class="card"><h2>나중에 주머니<small>지금 안 해도 되는 것들</small></h2><div class="row"><input type="text" id="ii" placeholder="떠오른 건 일단 여기에" onkeydown="if(event.key==\'Enter\')addI()"><button class="pri" onclick="addI()">담기</button></div>';
S.inbox.forEach(x=>{h+='<div class="mr"><span>'+esc(x.t)+'</span><button class="x" onclick="inF('+x.id+')">초점으로</button><button class="x" onclick="delI('+x.id+')">삭제</button></div>'});
h+='</section><section class="card"><h2>자기계발<small>최소 버전도 충분해요</small></h2><div class="chips">';
S.routines.forEach((r,i)=>{var v=C[r];h+='<button class="chip'+(v==2?' half':v?' on':'')+'" onclick="chk('+i+')">'+(v==2?'◐ 최소 · ':v?'✓ ':'')+esc(r)+'</button>'});
h+='<button class="chip" onclick="mg=!mg;render()">'+(mg?'닫기':'관리')+'</button></div>';
S.routines.forEach(r=>{if(S.min[r])h+='<div class="hint">'+esc(r)+' 최소 버전: '+esc(S.min[r])+'</div>'});
if(mg){S.routines.forEach((r,i)=>{h+='<div class="mr"><span>'+esc(r)+'</span><button class="x" onclick="mnR('+i+')">최소</button><button class="x" onclick="rnR('+i+')">이름</button><button class="x" onclick="dlR('+i+')">삭제</button></div>'});h+='<div class="row" style="margin-top:10px"><input type="text" id="ri" placeholder="새 루틴 이름"><button class="pri" onclick="addR()">추가</button></div>'}
h+='</section>';
h+='<section class="card"><h2>에너지와 쉼</h2><div class="ens">';
EL.forEach((l,i)=>{h+='<button class="ec'+(E==i+1?' on':'')+'" style="--c:'+EC[i]+'" onclick="en('+(i+1)+')"><i></i>'+l+'</button>'});
h+='</div><div style="margin-top:14px"><button class="chip'+(S.rest[sel]?' on':'')+'" style="width:100%;text-align:center" onclick="rest()">'+(S.rest[sel]?'✓ 충분히 쉬었어요':'잠깐이라도 쉬었어요')+'</button></div>';
if(E&&E<=2)h+='<div class="msg">에너지가 낮은 날이에요. 초점을 한 가지로 줄여도 충분해요.</div>';
h+='</section><section class="card"><h2>오늘 잘한 일<small>작은 것도 좋아요</small></h2><input type="text" value="'+esc(S.win[sel]||'')+'" placeholder="오늘 잘한 일 하나" onchange="S.win[sel]=this.value;save()"></section>'+memH()+'<section class="card"><h2>한 줄 기록<small>잊고 싶지 않은 것들</small></h2><textarea id="dt" placeholder="오늘 어땠어요? 한두 줄이면 충분해요." oninput="draft=this.value">'+esc(draft)+'</textarea>';
if(photo)h+='<img class="pv" src="'+photo+'"><button class="x" onclick="photo=null;render()">사진 빼기</button>';
h+='<div class="row" style="margin-top:10px"><label class="chip">사진 추가<input type="file" accept="image/*" hidden onchange="pick(this.files[0])"></label>'+(editId?'<button class="x" onclick="editId=null;draft=\'\';photo=null;render()">취소</button>':'')+'<button class="pri" style="margin-left:auto" onclick="saveD()">'+(editId?'수정 완료':'남기기')+'</button></div>';
S.diary.filter(e=>e.date==sel&&e.id!=editId).forEach(e=>{h+=entry(e,0)});
return h+'</section>'}
function entry(e,showDate){return '<div class="ent"><div class="sub">'+(showDate?e.date+' · ':'')+new Date(e.id).toTimeString().slice(0,5)+'</div><div>'+esc(e.text).replace(/\n/g,'<br>')+'</div>'+(e.photo?'<img src="'+e.photo+'">':'')+'<div class="row" style="margin-top:6px">'+(showDate?'<button class="x" onclick="jump(\''+e.date+'\')">그날로</button>':'')+'<button class="x" onclick="editD('+e.id+')">수정</button><button class="x" onclick="delD('+e.id+')">삭제</button></div></div>'}
function addF(){var v=document.getElementById('fi').value.trim();if(!v)return;(S.focus[sel]=S.focus[sel]||[]).push({t:v,d:0});save();render()}
function edF(i){var v=prompt('내용 수정',S.focus[sel][i].t);if(v&&v.trim()){S.focus[sel][i].t=v.trim();save();render()}}
function tog(i){S.focus[sel][i].d=S.focus[sel][i].d?0:1;save();render()}
function delF(i){S.focus[sel].splice(i,1);save();render()}
function chk(i){var r=S.routines[i];S.chk[sel]=S.chk[sel]||{};S.chk[sel][r]=!S.chk[sel][r];save();render()}
function addR(){var v=prompt('추가할 루틴 이름\n(이미 있는 이름을 입력하면 삭제 여부를 물어요)');if(!v||!v.trim())return;v=v.trim();var i=S.routines.indexOf(v);if(i>=0){if(confirm('“'+v+'” 루틴을 삭제할까요? (과거 기록은 남아요)'))S.routines.splice(i,1)}else S.routines.push(v);save();render()}
function en(n){S.energy[sel]=S.energy[sel]==n?0:n;save();render()}
function rest(){S.rest[sel]=!S.rest[sel];save();render()}
function pick(f){if(!f)return;var r=new FileReader();r.onload=()=>{var im=new Image();im.onload=()=>{var s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.7);render()};im.src=r.result};r.readAsDataURL(f)}
function saveD(){var t=draft.trim();if(!t&&!photo)return;if(editId){var e=S.diary.find(x=>x.id==editId);e.text=t;e.photo=photo}else S.diary.push({id:Date.now(),date:sel,text:t,photo:photo});if(save()){draft='';photo=null;editId=null;render()}else if(!editId)S.diary.pop()}
function editD(id){var e=S.diary.find(x=>x.id==id);if(e.date!=sel)sel=e.date;editId=id;draft=e.text;photo=e.photo;tab(0);document.getElementById('dt').focus()}
function delD(id){if(confirm('이 기록을 지울까요?')){S.diary=S.diary.filter(e=>e.id!=id);save();render()}}
function cmv(n){var p=cm.split('-'),d=new Date(+p[0],+p[1]-1+n,1);cm=ds(d).slice(0,7);render()}
function vCal(){
var p=cm.split('-'),y=+p[0],m=+p[1]-1,n=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay();
var h='<div class="hd"><button class="nv" onclick="cmv(-1)">‹</button><div class="dt"><div class="dd" style="font-size:34px">'+y+'. '+(m+1)+'</div></div><button class="nv" onclick="cmv(1)">›</button></div><section class="card"><div class="cal">'+WD.map(w=>'<div class="wh">'+w+'</div>').join('');
for(var i=0;i<off;i++)h+='<div></div>';
var st={e:0,en:0,rest:0,fd:0,ft:0,dr:0,rc:{}};S.routines.forEach(r=>st.rc[r]=0);
for(var i=1;i<=n;i++){var k=ds(new Date(y,m,i)),e=S.energy[k],c=S.chk[k]||{},ds_='';
S.routines.forEach(r=>{if(c[r]){ds_+='<b></b>';st.rc[r]++}});
if(S.diary.some(x=>x.date==k)){ds_+='✎';st.dr++}
if(S.rest[k]){ds_+='☾';st.rest++}
if(e){st.e+=e;st.en++}
(S.focus[k]||[]).forEach(f=>{st.ft++;if(f.d)st.fd++});
h+='<button class="cl'+(k==T?' td':'')+'" style="'+(e?'background:'+EC[e-1]+'88':'')+'" onclick="jump(\''+k+'\')"><span>'+i+'</span><span class="ds">'+ds_+'</span></button>'}
h+='</div><div class="lg">'+EL.map((l,i)=>'<span><i style="background:'+EC[i]+'"></i>'+l+'</span>').join('')+'</div><div class="lg"><span>● 루틴</span><span>✎ 기록</span><span>☾ 쉼</span></div></section>';
h+='<section class="card"><h2>이 달의 나<small>날짜를 누르면 그날을 열고 수정할 수 있어요</small></h2>';
h+='<div>평균 에너지 <b>'+(st.en?(st.e/st.en).toFixed(1):'-')+'</b> / 5 · 쉰 날 <b>'+st.rest+'</b>일</div><div>초점 완료 <b>'+st.fd+'</b> / '+st.ft+'개 · 기록한 날 <b>'+st.dr+'</b>일</div><div style="margin-top:12px">';
S.routines.forEach(r=>{h+='<div style="display:flex;justify-content:space-between;font-size:14px"><span>'+esc(r)+'</span><span>'+st.rc[r]+'일</span></div><div class="bar"><div style="width:'+(st.rc[r]/n*100)+'%"></div></div>'});
return h+'</div></section>'}
function vList(){
var L=S.diary.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id),h='<h2 style="margin:20px 4px 0;font-size:22px">지나온 기록들</h2><div class="q" style="text-align:left;margin:4px 4px 0">'+L.length+'개의 조각이 모였어요</div>',last='';
if(!L.length)return h+'<section class="card">아직 기록이 없어요. 하루 탭에서 한 줄을 남겨보세요.</section>';
L.forEach(e=>{if(e.date!=last){h+='<div class="gh">'+e.date.replace(/-/g,'. ')+' ('+WD[pd(e.date).getDay()]+')</div>';last=e.date}h+='<section class="card" style="margin:8px 0">'+entry(e,1).replace('<div class="ent">','<div>')+'</section>'});

function chk(i){var r=S.routines[i],v=(S.chk[sel]=S.chk[sel]||{})[r];S.chk[sel][r]=!v?1:(v!==2&&S.min[r]?2:0);save();render()}
function addR(){var v=document.getElementById('ri').value.trim();if(!v||S.routines.includes(v))return;S.routines.push(v);save();render()}
function mnR(i){var r=S.routines[i],v=prompt(r+'의 최소 버전 (예: 스트레칭 5분)\n비우면 삭제돼요',S.min[r]||'');if(v===null)return;v=v.trim();if(v)S.min[r]=v;else delete S.min[r];save();render()}
function rnR(i){var r=S.routines[i],v=prompt('새 이름',r);if(!v||!v.trim())return;v=v.trim();if(v==r||S.routines.includes(v))return;S.routines[i]=v;for(var k in S.chk)if(r in S.chk[k]){S.chk[k][v]=S.chk[k][r];delete S.chk[k][r]}if(S.min[r]){S.min[v]=S.min[r];delete S.min[r]}save();render()}
function dlR(i){var r=S.routines[i];if(confirm('“'+r+'” 루틴을 목록에서 뺄까요? 과거 기록은 남아요.')){S.routines.splice(i,1);save();render()}}
function addI(){var v=document.getElementById('ii').value.trim();if(!v)return;S.inbox.push({id:Date.now(),t:v});save();render()}
function delI(id){S.inbox=S.inbox.filter(x=>x.id!=id);save();render()}
function inF(id){var F=S.focus[sel]=S.focus[sel]||[];if(F.length>=3){alert('초점은 3개까지만 담아요. 하나를 마치거나 빼고 옮겨요.');return}F.push({t:S.inbox.find(y=>y.id==id).t,d:0});delI(id)}
function memH(){var d=pd(sel),o=[],a=new Date(d.getFullYear(),d.getMonth()-1,d.getDate()),h='';if(a.getDate()==d.getDate())o.push(['한 달 전 오늘',ds(a)]);
for(var y=1;y<=5;y++){var b=new Date(d.getFullYear()-y,d.getMonth(),d.getDate());if(b.getDate()==d.getDate())o.push([y+'년 전 오늘',ds(b)])}
o.forEach(p=>{var e=S.diary.filter(x=>x.date==p[1]),w=S.win[p[1]];if(!e.length&&!w)return;h+='<div class="mm"><div class="sub">'+p[0]+' · '+p[1]+'</div>'+(w?'<div>★ '+esc(w)+'</div>':'')+e.map(x=>'<div class="sm">'+esc(x.text.slice(0,80))+'</div>'+(x.photo?'<img src="'+x.photo+'" style="max-width:100%;border-radius:12px;margin-top:6px">':'')).join('')+'</div>'});
return h?'<section class="card"><h2>지난 오늘<small>잊고 있던 나</small></h2>'+h+'</section>':''}
var QW=['이번 주 가장 에너지를 준 일은?','이번 주 놓아줘도 괜찮았던 것은?','다음 주의 나에게 한마디'],QM=['이번 달 가장 뿌듯했던 순간은?','이번 달 나를 지치게 한 것은?','다음 달 딱 한 가지만 바꾼다면?'];
function setRev(k,i,v){(S.rev[k]=S.rev[k]||{})[i]=v;save()}
function rv(key,qs){var R=S.rev[key]||{};return qs.map((t,i)=>'<label class="rq">'+t+'</label><textarea style="min-height:64px" onchange="setRev(\''+key+'\','+i+',this.value)">'+esc(R[i]||'')+'</textarea>').join('')}
function rng(a,b){var o=[];for(var d=new Date(a);d<=b;d.setDate(d.getDate()+1))o.push(ds(d));return o}
function sumH(ks){var fd=0,ft=0,e=0,en=0,rt=0,rc=0;ks.forEach(k=>{(S.focus[k]||[]).forEach(f=>{ft++;if(f.d)fd++});if(S.energy[k]){e+=S.energy[k];en++}if(S.rest[k])rt++;S.routines.forEach(r=>{if((S.chk[k]||{})[r])rc++})});return '<div class="sm">초점 완료 '+fd+'/'+ft+' · 루틴 체크 '+rc+'회 · 쉰 날 '+rt+'일 · 평균 에너지 '+(en?(e/en).toFixed(1):'-')+'</div>'}
function gm(n){var d=pd(sel);sel=ds(new Date(d.getFullYear(),d.getMonth()+n,1));render()}
function nb(t,a,b){var s='style="font-size:24px;padding:0 10px"';return '<div class="row"><button class="nv" '+s+' onclick="'+a+'">‹</button><h2 style="margin:0;flex:1;text-align:center">'+t+'</h2><button class="nv" '+s+' onclick="'+b+'">›</button></div>'}
function vRev(){var d=pd(sel),ws=new Date(d);ws.setDate(d.getDate()-d.getDay());var we=new Date(ws);we.setDate(ws.getDate()+6),f=x=>(x.getMonth()+1)+'.'+x.getDate();
return '<h2 style="margin:20px 4px 0;font-size:22px">돌아보기</h2><section class="card">'+nb('주간 · '+f(ws)+' ~ '+f(we),'go(-7)','go(7)')+sumH(rng(ws,we))+rv('w:'+ds(ws),QW)+'</section><section class="card">'+nb('월간 · '+d.getFullYear()+'년 '+(d.getMonth()+1)+'월','gm(-1)','gm(1)')+sumH(rng(new Date(d.getFullYear(),d.getMonth(),1),new Date(d.getFullYear(),d.getMonth()+1,0)))+rv('m:'+ds(d).slice(0,7),QM)+'</section>'}
function bk(){var t=JSON.stringify(S),b=document.getElementById('bkt');b.value=t;b.select();var m='백업 코드를 복사했어요. 메모 앱 등에 붙여넣어 보관하세요.',m2='아래 칸의 내용을 직접 전체 복사해 주세요.';try{navigator.clipboard.writeText(t).then(()=>alert(m),()=>alert(m2))}catch(e){alert(m2)}}
function rstr(){try{var o=JSON.parse(document.getElementById('bkt').value.trim());if(!o.focus||!o.diary)throw 0;if(!confirm('현재 기록이 백업 내용으로 바뀌어요. 계속할까요?'))return;S=o;['focus','chk','energy','rest','win','rev','min','recDone'].forEach(k=>S[k]=S[k]||{});S.inbox=S.inbox||[];S.routines=S.routines||[];S.rec=S.rec||[];save();render()}catch(e){alert('백업 코드를 확인해 주세요.')}}
function drawL(){var l=document.getElementById('lst');if(!l)return;var s=q.trim().toLowerCase(),L=S.diary.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).filter(e=>(!s||(e.text+(S.win[e.date]||'')).toLowerCase().includes(s))&&(!po||e.photo)),h='<div class="q" style="text-align:left;margin:4px">'+L.length+'개의 조각</div>',last='';
if(po)h+='<div class="pg">'+L.map(e=>'<img src="'+e.photo+'" onclick="jump(\''+e.date+'\')">').join('')+'</div>';
else L.forEach(e=>{if(e.date!=last){h+='<div class="gh">'+e.date.replace(/-/g,'. ')+' ('+WD[pd(e.date).getDay()]+')</div>'+(S.win[e.date]?'<div class="sm" style="margin:2px 4px">★ '+esc(S.win[e.date])+'</div>':'');last=e.date}h+='<section class="card" style="margin:8px 0">'+entry(e,1).replace('<div class="ent">','<div>')+'</section>'});
l.innerHTML=h}
function vList(){setTimeout(drawL,0);return '<h2 style="margin:20px 4px 0;font-size:22px">지나온 기록들</h2><section class="card"><input type="text" placeholder="기록 검색 (글, 잘한 일)" value="'+esc(q)+'" oninput="q=this.value;drawL()"><div class="row" style="margin-top:10px"><button class="chip'+(po?' on':'')+'" onclick="po=!po;render()">사진만 모아보기</button><button class="chip" onclick="bk()">백업 복사</button></div></section><div id="lst"></div><section class="card"><h2>백업 복원<small>기기를 옮길 때</small></h2><textarea id="bkt" placeholder="백업 코드를 붙여넣고 복원을 누르세요"></textarea><div class="row" style="margin-top:8px"><button class="pri" onclick="rstr()">복원</button></div><div class="hint">사진이 많을수록 백업 코드가 길어져요.</div></section>'}
var bgp=false,PR=[['#f3d3bd','#d5e2cc'],['#e3d7f2','#f8d7e3'],['#d4e6f7','#d3f0e4'],['#fbf0c4','#fbdcc4'],['#f6d5d9','#f3e8d4'],['#d9d8f5','#d4ecf5'],['#d8ecd0','#f3efc9']];
function mx(c,b,t){var f=i=>Math.round(parseInt(c.substr(i,2),16)*t+parseInt(b.substr(i,2),16)*(1-t)).toString(16).padStart(2,'0');return '#'+f(1)+f(3)+f(5)}
function applyTheme(){var t=S.theme,r=document.documentElement.style,dk=matchMedia('(prefers-color-scheme: dark)').matches;if(!t){r.removeProperty('--b1');r.removeProperty('--b2');return}r.setProperty('--b1',dk?mx(t[0],'#1b1715',.4):t[0]);r.setProperty('--b2',dk?mx(t[1],'#1b1715',.4):t[1])}
function setT(i){S.theme=PR[i].slice();save();applyTheme();render()}
function setC(i,v){S.theme=S.theme||PR[0].slice();S.theme[i]=v;save();applyTheme();render()}
function thH(){if(!bgp)return '';var t=S.theme||PR[0];return '<section class="card"><h2>배경색<small>마음에 드는 분위기로</small></h2><div class="chips">'+PR.map((p,i)=>'<button class="sw" style="background:linear-gradient(135deg,'+p[0]+','+p[1]+')" onclick="setT('+i+')"></button>').join('')+'</div><div class="row" style="margin-top:12px"><label class="pk">왼쪽 위 <input type="color" value="'+t[0]+'" onchange="setC(0,this.value)"></label><label class="pk">오른쪽 <input type="color" value="'+t[1]+'" onchange="setC(1,this.value)"></label><button class="x" style="margin-left:auto" onclick="S.theme=null;save();applyTheme();render()">기본값</button></div></section>'}
applyTheme();

var rm=false,re=null,rf={t:'',m:0,d:[],time:'',dom:1};
function due(r,k){var d=pd(k);if(r.type=='m'){var n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()==Math.min(r.dom,n)}return r.days.includes(d.getDay())}
function rsum(r){return r.type=='m'?'매월 '+r.dom+'일':(r.days.length==7?'매일':'매주 '+r.days.map(d=>WD[d]).join('·'))}
function recH(){var L=S.rec.filter(r=>due(r,sel)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')),D=S.recDone[sel]||{};
var h='<section class="card"><h2>정기 일정<small>반복되는 일들</small></h2>';
if(!L.length)h+='<div class="sm">'+(S.rec.length?'이 날은 정기 일정이 없어요.':'매주 반복되는 일을 등록해 보세요.')+'</div>';
L.forEach(r=>{h+='<div class="f'+(D[r.id]?' done':'')+'"><button class="ck'+(D[r.id]?' on':'')+'" onclick="rdn('+r.id+')">'+(D[r.id]?'✓':'·')+'</button><span>'+(r.time?'<b>'+r.time+'</b> ':'')+esc(r.t)+'</span><button class="x" onclick="rF('+r.id+')">초점으로</button></div>'});
h+='<div style="margin-top:10px"><button class="chip" onclick="rm=!rm;render()">'+(rm?'닫기':'정기 일정 관리')+'</button></div>';
return h+(rm?recM():'')+'</section>'}
function recM(){var h='<div style="margin-top:12px">';
S.rec.forEach(r=>{h+='<div class="mr"><span>'+(r.time?r.time+' ':'')+esc(r.t)+'<div class="sub">'+rsum(r)+'</div></span><button class="x" onclick="rEd('+r.id+')">수정</button><button class="x" onclick="rDel('+r.id+')">삭제</button></div>'});
h+='<div class="hint">'+(re?'정기 일정 수정 중':'새 정기 일정 추가')+'</div><input type="text" placeholder="예: 스페인어 학원, 주간업무 작성" value="'+esc(rf.t)+'" oninput="rf.t=this.value" style="margin-top:6px">';
h+='<div class="row" style="margin:10px 0"><button class="chip'+(rf.m?'':' on')+'" onclick="rf.m=0;render()">매주</button><button class="chip'+(rf.m?' on':'')+'" onclick="rf.m=1;render()">매월</button><label class="pk" style="margin-left:auto">시간 <input type="time" value="'+rf.time+'" onchange="rf.time=this.value"></label></div>';
if(rf.m)h+='<div class="row"><span class="sm">매월</span><input type="number" min="1" max="31" value="'+rf.dom+'" onchange="rf.dom=+this.value||1" style="width:76px"><span class="sm">일</span></div>';
else h+='<div class="chips">'+WD.map((w,i)=>'<button class="chip'+(rf.d.includes(i)?' on':'')+'" onclick="rTg('+i+')">'+w+'</button>').join('')+'</div>';
return h+'<div class="row" style="margin-top:12px"><button class="pri" onclick="rSave()">'+(re?'수정 완료':'추가')+'</button>'+(re?'<button class="x" onclick="rReset();render()">취소</button>':'')+'</div></div>'}
function rTg(i){var a=rf.d,k=a.indexOf(i);if(k<0)a.push(i);else a.splice(k,1);render()}
function rReset(){re=null;rf={t:'',m:0,d:[],time:'',dom:1}}
function rSave(){var t=(rf.t||'').trim();if(!t){alert('일정 이름을 입력해 주세요.');return}if(!rf.m&&!rf.d.length){alert('요일을 하나 이상 골라 주세요.');return}
var o={id:re||Date.now(),t:t,type:rf.m?'m':'w',days:rf.m?[]:rf.d.slice().sort(),dom:Math.min(31,Math.max(1,rf.dom||1)),time:rf.time||''};
if(re)S.rec=S.rec.map(x=>x.id==re?o:x);else S.rec.push(o);save();rReset();render()}
function rEd(id){var r=S.rec.find(x=>x.id==id);re=id;rf={t:r.t,m:r.type=='m'?1:0,d:r.days.slice(),time:r.time||'',dom:r.dom||1};render()}
function rDel(id){if(confirm('이 정기 일정을 삭제할까요? 지난 체크 기록은 남아요.')){S.rec=S.rec.filter(x=>x.id!=id);if(re==id)rReset();save();render()}}
function rdn(id){var D=S.recDone[sel]=S.recDone[sel]||{};D[id]=!D[id];save();render()}
function rF(id){var r=S.rec.find(x=>x.id==id),F=S.focus[sel]=S.focus[sel]||[];if(F.length>=3){alert('초점은 3개까지만 담아요.');return}F.push({t:r.t,d:0,time:r.time||''});save();render()}

function addF(){var v=document.getElementById('fi').value.trim();if(!v)return;var t=document.getElementById('ft').value||'';(S.focus[sel]=S.focus[sel]||[]).push({t:v,d:0,time:t});save();render()}
function tmF(i){var f=S.focus[sel][i],v=prompt('시간을 24시간 형식으로 입력해 주세요 (예: 14:30)\n비우면 시간이 지워져요',f.time||'');if(v===null)return;v=v.trim();if(!v){f.time=''}else{var m=v.match(/^(\d{1,2}):(\d{2})$/);if(!m||+m[1]>23||+m[2]>59){alert('14:30 처럼 입력해 주세요.');return}f.time=m[1].padStart(2,'0')+':'+m[2]}save();render()}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
tab(0);
